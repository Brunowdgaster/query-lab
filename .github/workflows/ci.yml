name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  consultas:
    name: consultas (SQL ANSI, PL/pgSQL, T-SQL, Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: motores de banco
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 postgresql postgresql-client
          sudo service postgresql start
          # Falha ALTO se o servidor nao responder. Sem isto a suite PULARIA a
          # metade PostgreSQL e passaria verde tendo verificado um terco do que
          # diz verificar.
          for i in 1 2 3 4 5; do
            sudo -u postgres psql -tAc 'select 1' >/dev/null 2>&1 && break
            sleep 2
          done
          sudo -u postgres psql -tAc 'select version()'
          sqlite3 --version

      - name: motores embarcados (Cypher, SPARQL, GraphQL)
        run: |
          # Num venv porque o Ubuntu marca o Python do sistema como
          # externally-managed (PEP 668) e recusa `pip install` global. E com
          # versao FIXA, pelo mesmo argumento do nixpkgs travado.
          python3 -m venv .venv
          ./.venv/bin/pip install -q --disable-pip-version-check -r requirements.txt
          # Falha ALTO se algum nao importar. Sem isto a suite PULARIA tres
          # linguagens e passaria verde.
          ./.venv/bin/python -c 'import kuzu, rdflib, owlrl, graphql; print("kuzu", kuzu.__version__, "| rdflib", rdflib.__version__, "| graphql-core", graphql.version)'

      - name: o disco do runner, medido (e por que o Oracle fica fora)
        # Este passo existe para a DISPENSA do PL/SQL ter evidencia no log, e
        # nao ser uma afirmacao do README.
        #
        # A imagem do Oracle Database Free tem 13,8 GB -- medido com `docker
        # images`, nao estimado; o registro anterior dizia "~2,5 GB" e estava
        # errado por mais de cinco vezes.
        #
        # Se algum dia o runner crescer e a imagem couber, este log e o lugar
        # onde isso vai aparecer primeiro.
        run: |
          echo '--- espaco livre no runner ---'
          df -h / /mnt 2>/dev/null || df -h /
          echo
          livre_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "livre em /: ${livre_gb} GB   |   imagem do Oracle: 14 GB"
          if [ "$livre_gb" -gt 20 ]; then
            echo "NOTA: ha espaco de sobra -- vale reavaliar a dispensa do PL/SQL"
          else
            echo "confirmado: a imagem do Oracle nao cabe; o PL/SQL roda localmente"
          fi

      - name: a suite, em modo exigente
        # QLAB_EXIGE=1 transforma "pulado" em FALHA: no CI, uma dependencia
        # ausente e um defeito do ambiente, nao um resultado.
        #
        # QL_BAIXA_IMAGENS=1 autoriza a suite a baixar a imagem do SQL Server
        # (2,21 GB). Localmente ela NAO baixa sem autorizacao, porque gastar a
        # banda de quem rodou um teste sem avisar nao e aceitavel; num runner
        # descartavel, e.
        #
        # QL_SEM_ORACLE=1 dispensa o PL/SQL -- um "pulado que nao falha", com
        # motivo escrito, contado separado no resumo e com o disco medido no
        # passo anterior. E a UNICA dispensa do projeto, e ela e estreita de
        # proposito: baixar o EXIGE para todos os pulados seria pior que nao
        # ter EXIGE.
        env:
          QLAB_EXIGE: '1'
          QL_BAIXA_IMAGENS: '1'
          QL_SEM_ORACLE: '1'
        run: ./verifica.sh

      - name: a referencia gravada esta em dia
        # Separado da suite de proposito: se os CSV mudarem e o esperado/ nao
        # for regravado, TODAS as outras implementacoes passariam a ser
        # conferidas contra uma resposta obsoleta. Este passo diz isso com
        # nome proprio no log.
        run: |
          python3 python/referencia.py --gravar
          git diff --exit-code -- dados/esperado/ \
            || { echo 'dados/esperado/ esta velho: rode referencia.py --gravar'; exit 1; }
