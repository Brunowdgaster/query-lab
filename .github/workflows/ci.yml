name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  consultas:
    name: consultas (SQL ANSI, PL/pgSQL, T-SQL, Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: motores de banco
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 postgresql postgresql-client
          sudo service postgresql start
          # Falha ALTO se o servidor nao responder. Sem isto a suite PULARIA a
          # metade PostgreSQL e passaria verde tendo verificado um terco do que
          # diz verificar.
          for i in 1 2 3 4 5; do
            sudo -u postgres psql -tAc 'select 1' >/dev/null 2>&1 && break
            sleep 2
          done
          sudo -u postgres psql -tAc 'select version()'
          sqlite3 --version

      - name: motores embarcados (Cypher, SPARQL, GraphQL)
        run: |
          # Num venv porque o Ubuntu marca o Python do sistema como
          # externally-managed (PEP 668) e recusa `pip install` global. E com
          # versao FIXA, pelo mesmo argumento do nixpkgs travado.
          python3 -m venv .venv
          ./.venv/bin/pip install -q --disable-pip-version-check -r requirements.txt
          # Falha ALTO se algum nao importar. Sem isto a suite PULARIA tres
          # linguagens e passaria verde.
          ./.venv/bin/python -c 'import kuzu, rdflib, owlrl, graphql; print("kuzu", kuzu.__version__, "| rdflib", rdflib.__version__, "| graphql-core", graphql.version)'

      - name: o disco do runner, medido
        # Este passo foi escrito para dar EVIDENCIA a uma afirmacao minha --
        # que a imagem do Oracle (13,8 GB) nao cabia no runner, que eu dizia
        # ter "~14 GB de disco".
        #
        # Ele REFUTOU a afirmacao na primeira execucao: 91 GB livres. A
        # imagem cabe com folga, e o proprio passo imprimiu o aviso de
        # reavaliar que eu havia deixado nele.
        #
        # Entao o PL/SQL passou a rodar no CI, num job separado (`plsql`
        # abaixo), e este passo continua aqui porque foi ele que pegou o erro
        # -- e porque o numero pode mudar outra vez.
        run: |
          echo '--- espaco livre no runner ---'
          df -h / /mnt 2>/dev/null || df -h /
          echo
          livre_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "livre em /: ${livre_gb} GB   |   imagem do Oracle: 14 GB"
          if [ "$livre_gb" -lt 20 ]; then
            echo "ATENCAO: o runner encolheu -- o job plsql vai falhar no pull"
          fi

      - name: a suite, em modo exigente
        # QLAB_EXIGE=1 transforma "pulado" em FALHA: no CI, uma dependencia
        # ausente e um defeito do ambiente, nao um resultado.
        #
        # QL_BAIXA_IMAGENS=1 autoriza a suite a baixar a imagem do SQL Server
        # (2,21 GB). Localmente ela NAO baixa sem autorizacao, porque gastar a
        # banda de quem rodou um teste sem avisar nao e aceitavel; num runner
        # descartavel, e.
        #
        # QL_SEM_ORACLE=1 dispensa o PL/SQL NESTE job -- e a razao mudou, e
        # vale registrar qual era.
        #
        # ERA: "a imagem tem 13,8 GB e nao cabe no runner de ~14 GB". O passo
        # anterior mediu 91 GB livres e refutou isso.
        #
        # E AGORA: baixar 13,8 GB atrasaria o job que verifica as outras sete
        # linguagens, e uma falha no pull apareceria como falha das consultas.
        # Entao o PL/SQL tem job proprio (`plsql`), que roda em paralelo e
        # pode levar o tempo que precisar.
        #
        # A dispensa continua estreita de proposito: baixar o EXIGE para todos
        # os pulados seria pior que nao ter EXIGE.
        env:
          QLAB_EXIGE: '1'
          QL_BAIXA_IMAGENS: '1'
          QL_SEM_ORACLE: '1'
        run: ./verifica.sh

      - name: a referencia gravada esta em dia
        # Separado da suite de proposito: se os CSV mudarem e o esperado/ nao
        # for regravado, TODAS as outras implementacoes passariam a ser
        # conferidas contra uma resposta obsoleta. Este passo diz isso com
        # nome proprio no log.
        run: |
          python3 python/referencia.py --gravar
          git diff --exit-code -- dados/esperado/ \
            || { echo 'dados/esperado/ esta velho: rode referencia.py --gravar'; exit 1; }

  plsql:
    name: plsql (Oracle Database Free, em contêiner)
    runs-on: ubuntu-latest
    # Job separado, e não um passo do outro, por duas razões medidas:
    #
    #   * a imagem tem **13,8 GB**, e baixá-la dentro do job das consultas
    #     atrasaria a verificação das outras sete linguagens -- além de fazer
    #     uma falha de rede aparecer como falha delas;
    #   * o banco leva ~78 s para subir na primeira vez (medido localmente),
    #     porque cria o CDB.
    #
    # MEDIDO NO RUNNER, depois de o job existir: o pull levou **169 s** e a
    # suite inteira levou **24 s** -- subir o Oracle, criar o esquema,
    # traduzir a carga, compilar a procedure e rodar os 11 casos.
    #
    # O primeiro argumento se confirma: 169 s nao devem ser cobrados do job
    # das consultas. O segundo encolheu -- os ~78 s sao desta maquina, onde o
    # WSL2 e o /mnt/c cobram o preco deles, e nao do runner.
    #
    # E ele existe porque a afirmação de que "não cabe no runner" era FALSA: o
    # passo `o disco do runner, medido` do outro job mostrou **91 GB livres**,
    # contra os ~14 GB que eu havia afirmado sem medir.

    steps:
      - uses: actions/checkout@v5

      - name: a imagem do Oracle, com o tempo medido
        # O tempo é impresso porque ele é o único argumento que resta para
        # manter o PL/SQL fora do job principal. Se um dia a imagem encolher
        # ou o cache mudar, é aqui que se vê.
        run: |
          inicio=$(date +%s)
          docker pull container-registry.oracle.com/database/free:latest
          fim=$(date +%s)
          echo "--- pull levou $((fim - inicio))s ---"
          docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' \
            | grep oracle
          df -h / | tail -1

      - name: python3 (a tradução da carga)
        # O `traduz_carga.py` é Python puro e deriva a carga do Oracle de
        # `sql/carga.sql`, porque o Oracle não aceita `VALUES` multilinha --
        # recurso do SQL-92.
        run: python3 --version

      - name: os 11 casos do PL/SQL
        # O tempo total também é medido, pelo mesmo motivo do pull.
        run: |
          inicio=$(date +%s)
          bash plsql/roda.sh | tee /tmp/saida_plsql.txt
          fim=$(date +%s)
          echo "--- a suíte PL/SQL levou $((fim - inicio))s ---"
          grep -q '11 passaram, 0 falharam' /tmp/saida_plsql.txt \
            || { echo 'os 11 casos do PL/SQL não passaram'; exit 1; }
